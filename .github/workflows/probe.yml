name: Probe BGG proxy (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -D - -o out.xml -H "Origin: https://mfheimbach.github.io" "https://bgg-proxy.stonedsmile.workers.dev/?ids=13,302596" | grep -iE "^HTTP|access-control|x-cache"
          grep -o '<name type="primary"[^>]*>' out.xml
          echo "--- other origin:"; curl -sS -o /dev/null -w "%{http_code}\n" -H "Origin: https://evil.example" "https://bgg-proxy.stonedsmile.workers.dev/?ids=13"
          echo "--- bad ids:"; curl -sS -o /dev/null -w "%{http_code}\n" "https://bgg-proxy.stonedsmile.workers.dev/?ids=abc"

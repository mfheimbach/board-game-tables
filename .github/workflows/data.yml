name: Update game data
# Fetches BGG data for the games in the sheet (token stays here, server-side).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', 'web/config.json', 'web/sheet.js']
  schedule:
    - cron: '23 4 * * *'   # daily, so newly added games get player counts
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: node scripts/fetch_data.mjs
        env:
          BGG_TOKEN: ${{ secrets.BGG_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data
          git diff --cached --quiet || { git commit -m "Update game data"; git push; }
